name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the leading v (for example 0.3.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use stable semantic versioning, for example 0.3.1."
            exit 1
          fi

          manifest_version=$(node -p "require('./custom_components/centauri_file_sync/manifest.json').version")
          if [[ "$manifest_version" != "$RELEASE_VERSION" ]]; then
            echo "manifest.json contains $manifest_version, expected $RELEASE_VERSION."
            exit 1
          fi

          grep -Fq "VERSION = \"$RELEASE_VERSION\"" custom_components/centauri_file_sync/const.py
          grep -Fq "v$RELEASE_VERSION · upload only" custom_components/centauri_file_sync/frontend/panel.js
          grep -Fq "## $RELEASE_VERSION" CHANGELOG.md

      - name: Validate panel JavaScript
        run: |
          node --check custom_components/centauri_file_sync/frontend/panel.js
          node tests/test_frontend.js

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  publish:
    needs:
      - verify
      - hacs
      - hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$RELEASE_VERSION" \
            --generate-notes
